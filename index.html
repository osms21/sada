<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sadâ: YouTube podcastleriyle Arapça dinleme ve kelime çalışması (Türkçe arayüz).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232441A6'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='serif'%3E%D8%B5%3C/text%3E%3C/svg%3E">
<title>Sadâ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: a listening library → one episode as a ten-step path; sticky step bar, single reading column. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#141C33; --muted:#5B6479; --line:#DCE1EA;
  --accent:#2441A6; --accent-ink:#FFFFFF; --accent-soft:#E7ECFA;
  --ok:#0E8A7E; --ok-soft:#DDF3F0; --bad:#C9452C; --bad-soft:#FBE6E1; --gold:#C98A12; --gold-soft:#FBF0D8;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar:"Noto Naskh Arabic", "Amiri", "Geeza Pro", "Traditional Arabic", serif;
  --f-kufi:"Reem Kufi", "Noto Naskh Arabic", serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#151C2E; --ink:#E7EBF4; --muted:#98A1B6; --line:#262F47;
  --accent:#8099F3; --accent-ink:#0D1220; --accent-soft:#1D2646;
  --ok:#3CC3B3; --ok-soft:#0F2E2C; --bad:#F07A62; --bad-soft:#3A1C17; --gold:#EDBE55; --gold-soft:#33290F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#151C2E; --ink:#E7EBF4; --muted:#98A1B6; --line:#262F47;
  --accent:#8099F3; --accent-ink:#0D1220; --accent-soft:#1D2646;
  --ok:#3CC3B3; --ok-soft:#0F2E2C; --bad:#F07A62; --bad-soft:#3A1C17; --gold:#EDBE55; --gold-soft:#33290F; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:2;font-size:calc(1.3rem * var(--ars,1))}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:0}
.brand .kufi{font-family:var(--f-kufi);font-size:1.6rem;color:var(--accent);line-height:1}
.brand .lat{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.top .spacer{flex:1}
.fs{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.fs button{border:0;background:transparent;padding:4px 10px;font-weight:700;min-width:34px;min-height:32px}
.fs button:hover:not([disabled]){color:var(--accent)}
.fs button[disabled]{opacity:.35;cursor:default}
.fs .lbl{font-family:var(--f-ar);font-size:1.05rem;padding:0 4px;color:var(--muted);line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.92rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.icon{width:18px;height:18px;flex:none}
.speak{width:36px;height:36px;padding:0;border-radius:50%;flex:none}

/* home */
.hero{padding-block:40px 24px;display:grid;gap:14px}
.hero h1{font-size:clamp(2rem,5vw,3rem);font-weight:700;max-width:16ch}
.hero p{max-width:58ch;margin:0;color:var(--muted);font-size:1.05rem}
.wave{display:flex;align-items:center;gap:4px;height:40px}
.wave i{display:block;width:5px;border-radius:3px;background:var(--accent);opacity:.85}
@media (prefers-reduced-motion:no-preference){.wave i{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{transform:scaleY(.45)}}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-block:8px 18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding-bottom:48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px;text-align:left}
.ep-card{cursor:pointer}
.ep-card:hover{border-color:var(--accent)}
.ep-card .ar{font-family:var(--f-ar);font-weight:700;font-size:calc(1.6rem * var(--ars,1));line-height:1.8;color:var(--accent)}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.searchrow{margin-block:10px 4px}
#search{width:100%;max-width:520px;font:inherit;font-size:1rem;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
#search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:0;background:var(--bg);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:.78rem;font-weight:600}
.tag:hover{color:var(--accent)}
.ep-card .cover{width:calc(100% + 40px);max-width:none;margin:-20px -20px 0;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r) var(--r) 0 0;display:block}
.ep-card{overflow:hidden}
.ep-card .cover{object-position:85% 50%;aspect-ratio:3/2}
.hero-cover{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.hero-cover img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.hero-cover .ov{position:absolute;inset:0 auto 0 0;width:42%;display:grid;align-content:center;gap:4px;padding:0 2% 0 4%}
.hero-cover .ov .ar-title{color:#2441A6;text-align:right;font-size:clamp(1.6rem,3.6vw,2.4rem)}
.hero-cover .ov h1{color:#141C33;font-size:clamp(1.3rem,2.6vw,1.9rem)}
@media (max-width:700px){
  .hero-cover{border:0;overflow:visible}
  .hero-cover img{aspect-ratio:4/3;object-position:85% 50%;border-radius:var(--r)}
  .hero-cover .ov{position:static;width:auto;padding:12px 0 0}
  .hero-cover .ov .ar-title{color:var(--accent);text-align:start}
  .hero-cover .ov h1{color:var(--ink);font-size:1.6rem}
}
.prog{display:grid;gap:5px}
.prow{display:grid;grid-template-columns:62px 1fr 38px;align-items:center;gap:8px;font-size:.8rem;font-weight:600}
.prow b{text-align:end;font-variant-numeric:tabular-nums;color:var(--ok)}
.pathtag{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.9rem;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.actions{align-items:center}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pathcard{display:grid;gap:12px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;align-content:start}
.pathcard:hover{border-color:var(--accent)}
.pathcard.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pc-h{display:flex;gap:12px;align-items:center}
.pc-h b{font-family:var(--f-display);font-size:1.25rem}
.pc-i{font-size:1.8rem;line-height:1}
.pathcard ul{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:.93rem}
.pc-f{font-size:.85rem;font-weight:600;color:var(--accent)}
.finish{display:grid;gap:12px;justify-items:center;text-align:center;padding-block:32px;max-width:560px;margin:0 auto}
.finish p{margin:0}
.fin-i{font-size:3rem;line-height:1}
.soon{border-style:dashed;background:transparent;color:var(--muted);align-content:center;min-height:200px}

/* episode */
.ep-head{padding-block:28px 18px;display:grid;gap:12px}
.ep-head .ar-title{font-family:var(--f-ar);font-weight:700;font-size:clamp(1.9rem,5.5vw,2.6rem);color:var(--accent);direction:rtl;line-height:1.8}
.ep-head .actions{display:flex;gap:8px;flex-wrap:wrap}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,53px) - 1px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.steps .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:thin}
.phase{flex:none;display:grid;gap:4px;padding:4px 8px 6px;border-radius:12px}
.phase+.phase{border-inline-start:1px solid var(--line);border-radius:0 12px 12px 0}
.phase.on{background:var(--accent-soft)}
.ph-l{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.phase.on .ph-l{color:var(--accent)}
.ph-l b{font-family:var(--f-display)}
.ph-c{font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:0;opacity:.8}
.ph-s{display:flex;gap:6px}
.pattern{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden}
.pattern.open{border-color:var(--gold)}
.pat-h{width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:0;background:transparent;padding:12px 16px;text-align:start}
.pat-ar{font-size:calc(1.5rem * var(--ars,1));font-weight:700;line-height:1.5}
.pat-tr{font-weight:600;flex:1;min-width:0}
.chev{font-size:1.3rem;font-weight:700;color:var(--muted)}
.pat-b{padding:0 16px 16px;display:grid;gap:12px}
.pat-b ul{margin:0;padding-inline-start:20px;display:grid;gap:6px;font-size:.95rem}
.pat-ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px}
.ari{font-family:var(--f-ar);font-size:calc(1.2em * var(--ars,1));line-height:1.6}
.pat-i{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 10px;background:var(--bg)}
.pat-i .ar{font-size:calc(1.25rem * var(--ars,1));line-height:1.6}
.pat-i .muted{flex:1;font-size:.85rem}
.step{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px;font-size:.86rem;font-weight:600}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:.75rem;font-variant-numeric:tabular-nums}
.step.done .n{background:var(--ok);color:var(--surface)}
.step[aria-current="step"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.panel{padding-block:24px 64px;display:grid;gap:18px}
.panel-head{display:grid;gap:6px}
.panel-head h2{font-size:1.6rem}
.panel-head p{margin:0;color:var(--muted);max-width:62ch}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:600}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:5px 12px;display:grid;line-height:1.2;text-align:center}
.seg button span{font-weight:600;font-size:.88rem}
.seg button small{font-size:.7rem;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-checked="true"] small{color:var(--accent-ink);opacity:.8}
.veil{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;padding-block:10px 6px}
.veil i{display:block;height:10px;width:46px;border-radius:5px;background:var(--line)}
.veil i:nth-child(3n){width:30px}.veil i:nth-child(4n){width:62px}
.note{background:var(--gold-soft);color:var(--ink);border-radius:var(--r);padding:12px 16px;font-size:.92rem}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}

/* vocab */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.flip{position:relative;min-height:190px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:grid;align-content:space-between;gap:8px;text-align:center;cursor:pointer}
.flip:hover{border-color:var(--accent)}
.vic{width:56px;height:56px;color:var(--accent);margin:4px auto 0;display:block}
.vic.sm{width:28px;height:28px;margin:0 auto;opacity:.8}
.tile .vic{width:40px;height:40px;margin:0 auto}
[hidden]{display:none!important}
.flip .big{font-family:var(--f-ar);font-size:calc(2rem * var(--ars,1));direction:rtl;line-height:1.6}
.flip .trfront{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.3;padding-block:8px}
.flip .front{display:grid;justify-items:center;gap:6px}
.playbig{width:72px;height:72px;border-radius:50%;padding:0;margin:14px auto 0}
.playbig .icon{width:30px;height:30px}
.flip .tl{font-size:.85rem;color:var(--muted);font-style:italic}
.flip .back{display:grid;gap:6px}
.flip .tr{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.flip .root{font-family:var(--f-ar);direction:rtl;color:var(--muted);font-size:calc(1rem * var(--ars,1))}
.flip .ex{font-size:1.05rem}
.flip.seen{border-color:var(--ok)}
.flip .row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}

/* transcript */
.lines{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.line{display:grid;grid-template-columns:62px 1fr auto;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.line:last-child{border-bottom:0}
.line.sum{background:var(--accent-soft)}
.ts{font-variant-numeric:tabular-nums;font-size:.8rem;font-weight:700;text-decoration:none;color:var(--accent);padding-top:10px}
.ts:hover{text-decoration:underline}
.line .body{min-width:0;display:grid;gap:2px}
.who{font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.who.Y{color:var(--accent)} .who.L{color:var(--ok)}
.line .tr{color:var(--muted);font-size:.93rem}
.line .ar{font-size:calc(1.25rem * var(--ars,1))}

/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.q .qt{font-weight:600}
.qrow{display:flex;align-items:flex-start;gap:10px;direction:rtl}
.qrow .qt{flex:1;min-width:0;font-size:calc(1.35rem * var(--ars,1));font-weight:600;line-height:1.9}
.qn{flex:none;width:28px;height:28px;margin-top:8px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;font-weight:500}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt.ar-opt{font-family:var(--f-ar);font-size:calc(1.2rem * var(--ars,1));direction:rtl;line-height:1.6;padding:4px 14px}
.fb{font-size:.88rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.score{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.score b{font-family:var(--f-display);font-size:2rem;font-variant-numeric:tabular-nums}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:8px;align-content:start}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:56px;font-weight:600}
.tile.arw{font-family:var(--f-ar);font-size:calc(1.35rem * var(--ars,1));direction:rtl;font-weight:500;line-height:1.5}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tile.gone{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);opacity:.7}
.tile.shake{border-color:var(--bad);background:var(--bad-soft)}
@media (prefers-reduced-motion:no-preference){.tile.shake{animation:shake .35s}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* gaps */
.gap-s{font-family:var(--f-ar);direction:rtl;font-size:calc(1.4rem * var(--ars,1));line-height:2}
.blank{display:inline-block;min-width:90px;border-bottom:2px dashed var(--accent);text-align:center;color:var(--accent);padding-inline:6px}
.blank.filled{border-bottom-style:solid;color:var(--ok);border-color:var(--ok)}

/* order */
.olist{display:grid;gap:8px;counter-reset:o}
.oitem{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:right;justify-content:space-between}
.oitem .ar{font-size:calc(1.2rem * var(--ars,1))}
.oitem .k{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none}
.oitem{transition:transform .15s ease}
.oitem.dragging{transition:none;z-index:5;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.18);border-color:var(--accent)}
.grip{display:grid;place-items:center;width:28px;height:36px;color:var(--muted);cursor:grab;touch-action:none;flex:none;border-radius:6px}
.grip:hover{color:var(--accent);background:var(--accent-soft)}
.oitem.dragging .grip{cursor:grabbing}
.arrows{display:flex;gap:2px;flex:none}
.otext{flex:1;min-width:0;display:grid;gap:0;text-align:right}
.otr{font-size:.82rem;direction:ltr;text-align:right}
.oitem{gap:8px}
.arrows .btn{padding:4px 8px}
@media (prefers-reduced-motion:reduce){.oitem{transition:none}}
.oitem.right{border-color:var(--ok);background:var(--ok-soft)}
.oitem.wrong{border-color:var(--bad);background:var(--bad-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px;direction:rtl}
.pool .tile{font-family:var(--f-ar);font-size:calc(1.15rem * var(--ars,1));font-weight:500;line-height:1.6}

/* reading */
.reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:16px}
.reader h3{font-family:var(--f-ar);font-size:1.7rem;color:var(--accent);direction:rtl;text-align:right;font-weight:700;line-height:1.8}
.para{display:grid;gap:6px}
.para .ar{font-size:calc(1.35rem * var(--ars,1));line-height:2.1}
.para .row{display:flex;gap:8px;align-items:center}
.para .tr{color:var(--muted);font-size:.95rem;border-inline-start:3px solid var(--line);padding-inline-start:10px}

/* shadowing */
.shadow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.shadow .ar{font-size:calc(1.45rem * var(--ars,1))}
.shadow .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dots{display:flex;gap:5px;margin-inline-start:auto}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ok)}
.dots i.on{background:var(--ok)}

/* dictation */
.dict{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;justify-items:center;text-align:center}
.dict .out{font-family:var(--f-ar);direction:rtl;font-size:calc(2rem * var(--ars,1));min-height:64px;width:100%;max-width:420px;border:2px solid var(--line);border-radius:12px;padding:4px 12px;background:var(--bg);line-height:1.8}
.kb{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;direction:rtl;width:100%;max-width:520px}
.kb button{font-family:var(--f-ar);font-size:calc(1.25rem * var(--ars,1));border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 0;min-height:42px}
.kb button:hover{border-color:var(--accent)}
.dict input.out{text-align:center;color:var(--ink);font-family:var(--f-ar)}
.dict input.out:focus{outline:none;border-color:var(--accent)}
.kb.marks{grid-template-columns:repeat(6,minmax(0,1fr))}
.kb.marks button{display:grid;place-items:center;gap:0;padding:2px 0}
.kb.marks .mk{font-size:calc(1.5rem * var(--ars,1));line-height:1.3}
.kb.marks small{font-family:var(--f-body);font-size:.68rem;color:var(--muted)}
.kb .wide{grid-column:span 2;font-family:var(--f-body);font-size:.85rem;font-weight:600}

/* my morning */
.frames{display:grid;gap:12px}
.frame{display:grid;gap:8px}
.frame label{font-weight:600;font-size:.92rem}
.mine{background:var(--accent-soft);border-radius:var(--r);padding:20px;display:grid;gap:10px}
.mine .ar{font-size:calc(1.45rem * var(--ars,1));line-height:2.1}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:50;max-width:calc(100% - 32px);text-align:center}
@media (max-width:560px){
  .line{grid-template-columns:1fr auto;gap:6px}
  .line .ts{grid-column:1/-1;padding-top:0}
  .match{gap:6px}
  .tile.arw{font-size:calc(1.2rem * var(--ars,1))}
  .kb{grid-template-columns:repeat(7,minmax(0,1fr))}
}
.ytbox{position:sticky;z-index:12;background:var(--bg);padding:8px 0 10px;margin:-4px 0 6px}
.ytbox .frame{width:min(100%, calc(34vh * 16 / 9));aspect-ratio:16/9;margin:0 auto;border-radius:12px;overflow:hidden;background:#000}
.ytbox .frame iframe,.ytbox #ytp{width:100%;height:100%;display:block;border:0}
.ytbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);width:min(100%, calc(34vh * 16 / 9));margin:6px auto 0}
.ytbar a{color:var(--muted)}
.ytbar label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.line.now{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
</style>
</head>

/* ---------- speech ---------- */
let arVoice=null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  arVoice = vs.find(v=>/^ar(-|_|$)/i.test(v.lang)) || null;
  $('#voiceInfo').hidden = !!arVoice || vs.length===0;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate=0.85){
  if(!('speechSynthesis' in window)){ toast('Bu tarayıcı sesli okumayı desteklemiyor.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = arVoice ? arVoice.lang : 'ar-SA'; if(arVoice) u.voice = arVoice; u.rate = rate;
  speechSynthesis.speak(u);
}
const ICON_SPK = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

const spkBtn = (text, label='Dinle', rate) => `<button class="btn speak" data-say="${esc(text)}"${rate?` data-rate="${rate}"`:''} aria-label="${label}" title="${label}">${ICON_SPK}</button>`;
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-say]'); if(!b) return;

});

  {k:'mine', tr:'Senin Sabahın', d:'Üç kısa soruyla kendi sabahını Arapça anlat, sonra paragrafını yüksek sesle oku.', dAr:'اِخْتَرِ الْجُمَلَ الَّتِي تُنَاسِبُكَ، ثُمَّ اقْرَأْ فِقْرَتَكَ بِصَوْتٍ عَالٍ.'}
];
const PATHS = { quick:{ico:'⚡', tr:'Hızlı çalışma', time:'≈ 10–15 dk'}, full:{ico:'📚', tr:'Tam çalışma', time:'≈ 45–60 dk'} };
const LS = () => (pathOf(cur.ep.id)==='quick'?QSTEPS:STEPS).map(s=>Object.assign({}, s, ((cur.ep.ui||{})[s.k])||{}));
const pathOf = id => (store[id]||{}).path || null;
const stepsFor = id => pathOf(id)==='quick' ? QSTEPS : STEPS;
const doneFor = (id, path) => { const s=epState(id); if((path||pathOf(id))==='quick'){ s.qdone=s.qdone||{}; return s.qdone; } return s.done; };
function viewEp(ep){
  if(pathOf(ep.id)!=='quick' || !ep.quick) return ep;
  const q=ep.quick, sums=ep.segments.filter(s=>s.sum);
  return Object.assign({}, ep, {
    vocab: q.vocab.map(w=>typeof w==='number'?ep.vocab[w]:ep.vocab.find(v=>v.ar===w)).filter(Boolean),
    segments: ep.segments.filter(sg=>sg.t>=q.listen[0] && sg.t<q.listen[1]),
    questions: q.questions,
    frames: ep.frames.filter(f=>q.frames.includes(f.key)),
    shadowItems: q.shadow.map(i=>sums[i]),
    listenStart: q.listen[0], isQuick: true });
}
let cur = { ep:null, step:0 };
function markDone(k){ const d=doneFor(cur.ep.id); if(!d[k]){ d[k]=true; save(); renderSteps(); toast('Adım tamamlandı ✓'); } }
const progress = (ep, path='full') => { const st=store[ep.id]||{}; const d=(path==='quick'?st.qdone:st.done)||{}; const L=path==='quick'?QSTEPS:STEPS; return Math.round(L.filter(s=>d[s.k]).length/L.length*100); };

/* ---------- home ---------- */
let levelFilter = 'all', query = '';

  return query.trim().split(/\s+/).every(w=>hay.includes(fold(w)));
}
function gridHTML(){

function openEp(id, step){
  const ep = EPS.find(e=>e.id===id); if(!ep) return renderHome();
  cur.ep=ep; const st0=epState(id); cur.step = step ?? ((pathOf(id)==='quick'?st0.qlast:st0.last) ?? 0);
  if(cur.step >= stepsFor(id).length) cur.step = 0;
  try{ history.replaceState(null,'','#'+id); }catch(e){}
  app.innerHTML = `
  <section class="wrap ep-head">
    <button class="btn ghost sm" id="back" style="justify-self:start">← Tüm bölümler</button>
    <div class="meta"><span class="pill">${ep.level.replace('-','–')}</span><span class="pill plain">${esc(ep.variety)}</span><span class="pill plain">${ep.duration}</span><span class="pill plain">${esc(ep.topic)}</span></div>
    ${ep.cover?`<div class="hero-cover"><img src="${ep.cover}" alt="${esc(ep.coverAlt||'Bölüm kapağı')}"><div class="ov"><div class="ar-title">${esc(ep.titleAr)}</div><h1>${esc(ep.titleTr)}</h1></div></div>`
      :`<div class="ar-title">${esc(ep.titleAr)}</div><h1 style="font-size:1.6rem">${esc(ep.titleTr)}</h1>`}
    <p class="muted" style="margin:0;max-width:62ch">${esc(ep.summaryTr)}</p>

}
function renderPathTag(){
  const t=$('#pathTag'); if(!t) return; const P=PATHS[pathOf(cur.ep.id)||'full'];

    <div class="paths">

        <div class="pc-h"><span class="pc-i">⚡</span><div><b>Hızlı çalışma</b><div class="muted">≈ 10–15 dakika · 5 adım</div></div></div>

  $('#panel').querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>{ const st=epState(ep.id); st.path=b.dataset.path; save(); cur.step=(st.path==='quick'?st.qlast:st.last)||0; if(cur.step>=stepsFor(ep.id).length) cur.step=0; renderPathTag(); renderSteps(); renderStep(); window.scrollTo({top:$('#panel').offsetTop-140}); });

function renderSteps(){
  const bar=$('#stepbar'); if(!bar) return; const d=doneFor(cur.ep.id);
  if(pathOf(cur.ep.id)==='quick'){
    bar.innerHTML = `<div class="phase on"><div class="ph-l"><b>⚡</b> Hızlı çalışma <span class="ph-c">${QSTEPS.filter(s=>d[s.k]).length}/${QSTEPS.length}</span></div><div class="ph-s">${LS().map((s,i)=>`<button class="step${d[s.k]?' done':''}" data-i="${i}" ${i===cur.step?'aria-current="step"':''}><span class="n">${d[s.k]?'✓':i+1}</span>${s.tr}</button>`).join('')}</div></div>`;
    bar.querySelectorAll('.step').forEach(b=>b.onclick=()=>{cur.step=+b.dataset.i;renderStep();});
    return;
  }
  bar.innerHTML = PHASES.map((ph,pi)=>{ const ss=LS().map((s,i)=>[s,i]).filter(([s])=>s.ph===pi); const dn=ss.filter(([s])=>d[s.k]).length;
    return `<div class="phase${STEPS[cur.step].ph===pi?' on':''}"><div class="ph-l"><b>${pi+1}</b> ${ph} <span class="ph-c">${dn}/${ss.length}</span></div><div class="ph-s">${
      ss.map(([s,i])=>`<button class="step${d[s.k]?' done':''}" data-i="${i}" ${i===cur.step?'aria-current="step"':''}><span class="n">${d[s.k]?'✓':i+1}</span>${s.tr}</button>`).join('')}</div></div>`; }).join('');
  bar.querySelectorAll('.step').forEach(b=>b.onclick=()=>{cur.step=+b.dataset.i;renderStep();});
  const ph=bar.querySelector('.phase.on'), a=bar.querySelector('[aria-current]');
  if(ph) bar.scrollLeft = ph.offsetLeft - bar.offsetLeft - 8;
  if(a){ const r=a.getBoundingClientRect(), br=bar.getBoundingClientRect(); if(r.right>br.right-8) bar.scrollLeft += r.right-br.right+16; }
}
function goStep(i){ cur.step=i; renderStep(); const p=$('#panel'); window.scrollTo({top:p.offsetTop-120}); }
function renderStep(){
  const Q = pathOf(cur.ep.id)==='quick', L = LS();
  const s=L[cur.step], st=epState(cur.ep.id); if(Q) st.qlast=cur.step; else st.last=cur.step; save();
  renderSteps();
  const p=$('#panel');
  p.innerHTML = `<div class="panel-head"><div class="eyebrow">${Q?'⚡ Hızlı çalışma':`Aşama ${s.ph+1} · ${PHASES[s.ph]}`} — Adım ${cur.step+1} / ${L.length}</div><h2>${s.tr}</h2><p>${s.d}</p>${s.dAr?`<p class="ar" style="color:var(--ink);font-size:1.2rem;max-width:none">${s.dAr}</p>`:''}</div><div id="body" style="display:grid;gap:16px"></div>

    ${cur.step<L.length-1?`<button class="btn primary" id="next">Sonraki adım: ${L[cur.step+1].tr} →</button>`:`<button class="btn primary" id="next">Bölümü bitir</button>`}
  </div>`;
  $('#prev').onclick=()=>goStep(cur.step-1);
  $('#next').onclick=()=>{ if(cur.step<L.length-1) goStep(cur.step+1); else renderFinish(); };
  VIEWS[s.k]($('#body'), viewEp(cur.ep));
}
function renderFinish(){
  const Q = pathOf(cur.ep.id)==='quick', L=LS(), d=doneFor(cur.ep.id);
  const left = L.filter(s=>!d[s.k]);

  $('#stepbar').querySelectorAll('.step').forEach(b=>b.removeAttribute('aria-current'));
  $('#panel').innerHTML = `<div class="finish">
    <div class="fin-i" aria-hidden="true">${Q?'⚡':'🎉'}</div>
    <h2>${rest.length?'Bölümün sonuna geldin':'Tebrikler!'}</h2>

    ${Q&&!rest.length?'<p class="muted">Vaktin olduğunda tam çalışmayla devam edebilirsin: daha çok kelime, bölümün tamamı, okuma ve dikte seni bekliyor.</p>':''}

  const tf=$('#toFull'); if(tf) tf.onclick=()=>{ const st=epState(cur.ep.id); st.path='full'; save(); cur.step=st.last||0; renderPathTag(); renderSteps(); renderStep(); };

}

const VIEWS = {};

VIEWS.vocab = (el, ep) => {
  const P = prefs(); if(!P.card) P.card='ar';
  const groups = [...new Set(ep.vocab.map(v=>v.g))];
  let g = groups[0]; const open = new Set(); const seen = new Set();
  const MODES = [['ar','Arapça → Türkçe','Tanı'],['audio','Sesten tanı','Kulakla'],['tr','Türkçe → Arapça','Hatırla']];
  const TIPS = {
    ar: 'Arapça kelimeyi oku, anlamını tahmin et, sonra kartı çevir.',
    audio: 'Kartta yazı yok. ▶ düğmesine bas, kelimeyi dinle ve anlamını tahmin et. Sonra kartı çevir.',
    tr: 'Türkçe anlama bak ve Arapçasını söylemeye çalış. Sonra kartı çevirip kontrol et.'
  };
  const draw = () => {
    const M = P.card;
    const items = ep.vocab.filter(v=>v.g===g);
    const front = v => M==='audio'
      ? `<button class="btn primary playbig" data-say="${esc(v.ar)}" aria-label="Kelimeyi dinle">${ICON_SPK}</button><div class="muted" style="font-size:.85rem">Dinle ve tahmin et</div>`
      : M==='tr'
      ? `${icon(v.ic)}<div class="trfront">${esc(v.tr)}</div>`
      : `${icon(v.ic)}<div class="big">${esc(v.ar)}</div>`;
    el.innerHTML = `
      <div class="toolbar">
        <div class="seg" role="radiogroup" aria-label="Kart yönü">${MODES.map(([k,l,n])=>`<button role="radio" aria-checked="${M===k}" data-m="${k}"><span>${l}</span><small>${n}</small></button>`).join('')}</div>
      </div>
      <div class="note">${TIPS[M]}${M==='audio'&&!arVoice?' <b>Not:</b> Bu cihazda Arapça ses bulunamadı; bu mod için Arapça sesi olan bir tarayıcı ya da cihaz gerekebilir.':''}</div>
      <div class="tabs" role="group" aria-label="Tema">${groups.map(x=>`<button class="chip" data-g="${x}" aria-pressed="${x===g}">${x} <span class="muted">${ep.vocab.filter(v=>v.g===x).length}</span></button>`).join('')}</div>
      <div class="vgrid">${items.map(v=>{const i=ep.vocab.indexOf(v), o=open.has(i);return `
        <div class="flip${seen.has(i)?' seen':''}" data-i="${i}" tabindex="0" role="button" aria-label="Kartı çevir">
          <div class="front" ${o?'hidden':''}>${front(v)}</div>
          <div class="back" ${o?'':'hidden'}>
            <div class="big" style="font-size:calc(1.5rem * var(--ars,1))">${esc(v.ar)}</div>${icon(v.ic,'vic sm')}
            <div class="tr">${esc(v.tr)}</div>
            <div class="root">الجذر: ${esc(v.root)}</div>
            <div class="ar ex">${esc(v.ex)}</div>
            ${v.tk?`<div class="row"><span class="pill gold">Türkçede: ${esc(v.tk)}</span></div>`:''}
          </div>
          ${o ? `<div class="row">${spkBtn(v.ar,'Kelimeyi dinle')}${spkBtn(v.ex,'Örnek cümleyi dinle')}</div>`
              : M==='ar' ? `<div class="row">${spkBtn(v.ar,'Kelimeyi dinle')}</div>` : '<div class="row"><span class="muted" style="font-size:.8rem">Çevirmek için dokun</span></div>'}
        </div>`}).join('')}</div>
      <p class="muted" style="margin:0;font-size:.9rem">${seen.size} / ${ep.vocab.length} kart çevrildi · <span class="pill gold" style="font-size:.75rem">Türkçede</span> etiketi aynı kökten gelen Türkçe kelimeyi gösterir.</p>`;
    el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ P.card=b.dataset.m; save(); open.clear(); draw(); });

      c.onclick=e=>{ if(e.target.closest('[data-say]')) return; flip(); }; c.onkeydown=e=>{ if(e.target===c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();flip();} };

let YTP=null, ytTimer=null;
function ytApi(){ return new Promise(r=>{ if(window.YT&&YT.Player) return r(); const prev=window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady=()=>{ if(prev) prev(); r(); }; if(!document.getElementById('ytapi')){ const s=document.createElement('script'); s.id='ytapi'; s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s); } }); }
function ytMount(ep, start, root){
  clearInterval(ytTimer); YTP=null;
  const sb=document.querySelector('.steps'), top=document.querySelector('.top'), box=root.querySelector('.ytbox');
  if(box) box.style.top=((top?top.offsetHeight:0)+(sb?sb.offsetHeight:0)-2)+'px';
  ytApi().then(()=>{
    if(!root.isConnected || !document.getElementById('ytp')) return;
    YTP=new YT.Player('ytp',{videoId:ep.youtubeId,width:'100%',height:'100%',playerVars:{start:Math.floor(start||0),rel:0,playsinline:1,modestbranding:1}});
    let last=-1;
    ytTimer=setInterval(()=>{
      if(!root.isConnected){ clearInterval(ytTimer); YTP=null; return; }
      if(!YTP||!YTP.getCurrentTime) return;
      const t=YTP.getCurrentTime(); const lines=[...root.querySelectorAll('.line[data-t]')];
      let idx=-1; for(let i=0;i<lines.length;i++){ if(+lines[i].dataset.t<=t+0.3) idx=i; else break; }
      if(idx<0 || lines[idx].classList.contains('now')){ if(idx!==last) last=idx; return; }
      lines.forEach(l=>l.classList.remove('now')); lines[idx].classList.add('now');
      const f=root.querySelector('#ytFollow'), playing=YTP.getPlayerState&&YTP.getPlayerState()===1;
      if(idx!==last && f && f.checked && playing){ const r=lines[idx].getBoundingClientRect(), b=root.querySelector('.ytbox').getBoundingClientRect(); if(r.top<b.bottom+4 || r.bottom>innerHeight-8) window.scrollBy({top:r.top-b.bottom-16,behavior:'smooth'}); }
      last=idx;
    },400);
  });
}
function ytSeek(t){ if(YTP&&YTP.seekTo){ YTP.seekTo(t,true); if(YTP.playVideo) YTP.playVideo(); return true; } return false; }

VIEWS.listen = (el, ep) => {

function quiz(el, ep, qs, doneKey, withTime){
  const ans = new Array(qs.length).fill(null); const showTr = new Set();
  const draw = () => {
    const n = ans.filter(a=>a!==null).length, right = ans.filter((a,i)=>a!==null && a===qs[i].a).length;
    el.innerHTML = qs.map((q,i)=>{
      const AR = q.lang==='ar';
      const opts = q.type==='tf' ? (AR?[['صَحِيحٌ',true],['خَطَأٌ',false]]:[['Doğru',true],['Yanlış',false]]) : q.opts.map((o,j)=>[o,j]);
      const a = ans[i];
      return `<div class="q${AR?' q-ar':''}">
        ${AR?`<div class="qrow"><span class="qn">${i+1}</span><div class="qt ar">${esc(q.q)}</div>${spkBtn(q.q,'Soruyu dinle')}</div>
          <div><button class="btn sm ghost" data-trq="${i}">${showTr.has(i)?'Türkçesini gizle':'Türkçesini göster'}</button>${showTr.has(i)?` <span class="muted" style="font-size:.9rem">${esc(q.qTr)}</span>`:''}</div>`
          :`<div class="qt">${i+1}. ${esc(q.q)}</div>`}
        <div class="opts"${AR?' style="direction:rtl"':''}>${opts.map(([l,v])=>{
          let c=''; if(a!==null){ if(v===q.a) c=' right'; else if(v===a) c=' wrong'; }
          return `<button class="opt${AR?' ar-opt':''}${c}" data-q="${i}" data-v="${v}" ${a!==null?'disabled':''}>${esc(l)}</button>`;}).join('')}</div>
        ${a!==null?`<div class="fb ${a===q.a?'ok':'no'}">${a===q.a?'Doğru!':'Doğru cevap işaretlendi.'}${withTime&&q.t!=null?` <a href="${yt(ep,q.t)}" target="_blank" rel="noopener">${mmss(q.t)} anını tekrar dinle</a>`:''}</div>`:''}
      </div>`;}).join('') +
      (n===qs.length?`<div class="score"><b>${right}/${qs.length}</b><div><div style="font-weight:600">${right===qs.length?'Mükemmel!':right>=qs.length*0.7?'Çok iyi!':'Bir kez daha dinlemeye ne dersin?'}</div><button class="btn sm" id="again" style="margin-top:6px">Tekrar dene</button></div></div>`:'');
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.q, raw=b.dataset.v; ans[i] = raw==='true'?true:raw==='false'?false:+raw; draw();
      if(ans.every(a=>a!==null)) markDone(doneKey);
    });
    el.querySelectorAll('[data-trq]').forEach(b=>b.onclick=()=>{const i=+b.dataset.trq; showTr.has(i)?showTr.delete(i):showTr.add(i); draw();});
    const ag=$('#again',el); if(ag) ag.onclick=()=>{ans.fill(null);draw();};
  };
  draw();
}
VIEWS.quiz = (el, ep) => quiz(el, ep, ep.questions, 'quiz', true);

VIEWS.match = (el, ep) => {
  const mode = el.dataset.mode || 'tr';
  const src = mode==='pic' ? ep.vocab.filter(v=>v.ic && !v.nopic && !PIC_SKIP.has(v.ic)) : ep.vocab;
  const rounds = []; const pool = shuffle(src); for(let i=0;i<pool.length;i+=6) rounds.push(pool.slice(i,i+6));
  if(rounds.length>1 && rounds[rounds.length-1].length<4) rounds[rounds.length-2].push(...rounds.pop());
  let r=0, sel=null, gone=new Set(), miss=0;
  const draw = () => {
    const set = rounds[r]; const L = set.map((v,i)=>i), R = shuffle(L);
    el.innerHTML = `<div class="toolbar"><div class="tabs" role="group" aria-label="Eşleştirme türü"><button class="chip" data-mode="tr" aria-pressed="${mode==='tr'}">Kelime ↔ Türkçe</button><button class="chip" data-mode="pic" aria-pressed="${mode==='pic'}">Kelime ↔ Resim</button></div><span class="pill">Tur ${r+1} / ${rounds.length}</span><span class="pill plain" id="miss">Hata: ${miss}</span></div>
      <div class="match">
        <div class="mcol">${L.map(i=>`<button class="tile arw${gone.has(i)?' gone':''}" data-side="a" data-i="${i}" ${gone.has(i)?'disabled':''}>${esc(set[i].ar)}</button>`).join('')}</div>
        <div class="mcol">${R.map(i=>`<button class="tile${gone.has(i)?' gone':''}" data-side="t" data-i="${i}" ${gone.has(i)?'disabled':''} ${mode==='pic'?`aria-label="Resim ${i+1}"`:''}>${mode==='pic'?icon(set[i].ic):esc(set[i].tr)}</button>`).join('')}</div>
      </div>`;
    el.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ el.dataset.mode=b.dataset.mode; VIEWS.match(el,ep); });
    el.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
      if(!sel || sel.dataset.side===b.dataset.side){ el.querySelectorAll('.tile.sel').forEach(x=>x.classList.remove('sel')); sel=b; b.classList.add('sel'); if(b.dataset.side==='a') speak(set[+b.dataset.i].ar); return; }
      if(sel.dataset.i===b.dataset.i){
        const i=+b.dataset.i; gone.add(i); sel=null;
        el.querySelectorAll(`.tile[data-i="${i}"]`).forEach(x=>{x.classList.remove('sel');x.classList.add('gone');x.disabled=true;});
        if(gone.size===set.length){
          if(r<rounds.length-1){ setTimeout(()=>{r++;gone=new Set();draw();},500); }
          else { markDone('match'); el.insertAdjacentHTML('beforeend',`<div class="score"><b>✓</b><div><div style="font-weight:600">Tüm kelimeleri eşleştirdin. Toplam hata: ${miss}</div><button class="btn sm" id="again" style="margin-top:6px">Yeniden oyna</button></div></div>`); $('#again',el).onclick=()=>VIEWS.match(el,ep); }
        }
      } else {
        miss++; const a=sel, c=b; a.classList.add('shake'); c.classList.add('shake'); sel=null;
        el.querySelector('#miss').textContent='Hata: '+miss;
        setTimeout(()=>{a.classList.remove('shake','sel');c.classList.remove('shake');},400);
      }
    });
  };
  draw();
};

VIEWS.order = (el, ep) => {
  let pool = shuffle(ep.order.map((o,i)=>i)); while(pool.every((v,i)=>v===i)) pool=shuffle(pool);
  let picked = [], checked=false, tries=0;
  const GRIP = '<svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
  const move = (from, to) => { if(to<0||to>=picked.length||from===to) return; const [x]=picked.splice(from,1); picked.splice(to,0,x); checked=false; draw(); };
  const draw = () => {
    const full = !pool.length, allRight = checked && picked.every((v,k)=>v===k);
    el.innerHTML = `
      <div class="eyebrow">Senin sıran</div>
      ${full&&!allRight?`<div class="note">${checked?'Kırmızı kartları tutamaçtan (⋮⋮) sürükleyerek doğru yere taşı, sonra yeniden kontrol et.':'Sıralamayı değiştirmek için kartı tutamaçtan (⋮⋮) sürükle ya da ok düğmelerini kullan.'}</div>`:''}
      <div class="olist" id="olist">${picked.length?picked.map((i,k)=>`<div class="oitem${checked?(i===k?' right':' wrong'):''}${full&&!allRight?' dragok':''}" data-k="${k}">
          ${full&&!allRight?`<span class="grip" data-grip="${k}" aria-hidden="true">${GRIP}</span>`:''}
          <span class="k">${k+1}</span><span class="otext"><span class="ar">${esc(ep.order[i].ar)}</span>${checked?`<span class="muted otr">${esc(ep.order[i].tr)}</span>`:''}</span>
          ${full&&!allRight?`<span class="arrows"><button class="btn sm ghost" data-up="${k}" aria-label="Yukarı taşı" ${k===0?'disabled':''}>↑</button><button class="btn sm ghost" data-dn="${k}" aria-label="Aşağı taşı" ${k===picked.length-1?'disabled':''}>↓</button></span>`:''}
        </div>`).join(''):'<div class="muted">Aşağıdaki kartlardan ilk adımı seç.</div>'}</div>
      ${pool.length?`<div class="eyebrow">Kartlar</div><div class="pool">${pool.map(i=>`<button class="tile" data-i="${i}">${esc(ep.order[i].ar)}</button>`).join('')}</div>`:''}
      <div class="toolbar">
        ${full&&!allRight?`<button class="btn primary" id="chk">${tries?'Yeniden kontrol et':'Kontrol et'}</button>`:''}
        <button class="btn" id="rst">Baştan başla</button>
      </div>
      ${checked?`<div class="score"><b>${picked.filter((v,k)=>v===k).length}/${picked.length}</b><div style="font-weight:600">${allRight?((ep.ui&&ep.ui.order&&ep.ui.order.done)||'Tam isabet! Yusuf\'un sabahını doğru sıraladın.'):'Yeşil olanlar doğru yerde. Kırmızıları sürükleyip yeniden dene.'}</div></div>`:''}`;
    el.querySelectorAll('.pool .tile').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; picked.push(i); pool=pool.filter(x=>x!==i); speak(ep.order[i].ar); draw(); });
    el.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up, +b.dataset.up-1));
    el.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>move(+b.dataset.dn, +b.dataset.dn+1));
    const c=$('#chk',el); if(c) c.onclick=()=>{ checked=true; tries++; draw(); if(picked.every((v,k)=>v===k)) markDone('order'); };
    $('#rst',el).onclick=()=>VIEWS.order(el,ep);
    // pointer drag (mouse + touch)
    el.querySelectorAll('[data-grip]').forEach(g=>g.addEventListener('pointerdown', ev=>{
      ev.preventDefault();
      const list=$('#olist',el), items=[...list.querySelectorAll('.oitem')], from=+g.dataset.grip, item=items[from];
      const rects=items.map(x=>x.getBoundingClientRect()), step=rects.length>1? rects[1].top-rects[0].top : rects[0].height+8;
      const y0=ev.clientY; let to=from;
      item.classList.add('dragging'); g.setPointerCapture(ev.pointerId);
      const onMove = m => {
        const dy=m.clientY-y0; item.style.transform=`translateY(${dy}px)`;
        to=Math.max(0,Math.min(items.length-1, from+Math.round(dy/step)));
        items.forEach((x,j)=>{ if(j===from) return; let s=0; if(from<to && j>from && j<=to) s=-step; if(from>to && j<from && j>=to) s=step; x.style.transform=s?`translateY(${s}px)`:''; });
      };
      const onUp = () => { g.removeEventListener('pointermove',onMove); g.removeEventListener('pointerup',onUp); g.removeEventListener('pointercancel',onUp);
        items.forEach(x=>x.style.transform=''); item.classList.remove('dragging'); if(to!==from) move(from,to); };
      g.addEventListener('pointermove',onMove); g.addEventListener('pointerup',onUp); g.addEventListener('pointercancel',onUp);
    }));
  };
  draw();
};

/* Esnek dikte değerlendirmesi: hareke isteğe bağlı; yazılan harekeler doğruysa övülür, yanlışsa uyarılır. */
const HAR_RE = /[ً-ْٰ]/;
const loose = s => strip(s).replace(/[أإآٱ]/g,'ا').replace(/[ؤئ]/g,'ء').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ـ/g,'').replace(/\s+/g,'');
function letters(s){ const out=[]; for(const ch of s.replace(/\s+/g,'')){ if(HAR_RE.test(ch)){ if(out.length) out[out.length-1].m.add(ch); } else out.push({c:ch,m:new Set()}); } return out; }
function gradeDict(typed, target){
  const t = typed.trim(); if(!t) return {k:'empty'};
  const T = strip(t).replace(/\s+/g,''), G = strip(target).replace(/\s+/g,'');
  const hasMarks = HAR_RE.test(t);
  if(T===G){
    if(!hasMarks) return {k:'ok', msg:'Doğru! Harekesiz yazdın, bu da kabul.'};
    const A=letters(t), B=letters(target); let bad=0, full=true;
    A.forEach((x,j)=>{ const y=B[j]; if(!y) return; if(x.m.size===0){ if(y.m.size) full=false; return; } x.m.forEach(m=>{ if(!y.m.has(m)) bad++; }); if(x.m.size<y.m.size) full=false; });
    if(bad) return {k:'mark', msg:'Harfler doğru! Bazı harekeler farklı; doğru yazılışa bak.'};
    return {k:'ok', msg: full ? 'Mükemmel! Harekeleriyle birlikte tam doğru.' : 'Doğru! Yazdığın harekeler de doğru.'};
  }
  const lt=loose(t), lg=loose(target);
  if(lt===lg){
    let note='Neredeyse! Küçük bir yazım farkı var';
    if(/ه$/.test(T) && /ة$/.test(G)) note='Neredeyse! Kelime sonunda ه değil ة (tā marbūṭa) olmalı';
    else if(/ي$/.test(T) && /ى$/.test(G)) note='Neredeyse! Kelime sonunda ي değil ى olmalı';
    else if(/[اأإآ]/.test(T+G)) note='Neredeyse! Hemzeli elif (أ / إ / آ) farkı var';
    return {k:'near', msg: note+'.'};
  }
  if(lt.replace(/^ال/,'')===lg.replace(/^ال/,'')) return {k:'near', msg:'Doğru kelime! Sadece başındaki ال (harf-i tarif) fazla ya da eksik.'};
  return {k:'no', msg:'Doğrusu:'};
}

VIEWS.dict = (el, ep) => {
  const words = ep.dictation; let i=0, typed='', res=null, score=0, hintOn=false, showMarks=false;
  const hint = w => (ep.vocab.find(v=>norm(v.ar).replace(/^ال/,'')===norm(w))||{}).tr || '';
  const KEYS = 'ا ب ت ث ج ح خ د ذ ر ز س ش ص ض ط ظ ع غ ف ق ك ل م ن ه و ي ة ى أ إ ء ؤ ئ'.split(' ');
  const MARKS = [['َ','üstün'],['ِ','esre'],['ُ','ötre'],['ْ','cezm'],['ّ','şedde'],['ً','iki üstün']];
  const draw = () => {
    if(i>=words.length){ el.innerHTML=`<div class="score"><b>${score}/${words.length}</b><div><div style="font-weight:600">Dikte bitti.</div><button class="btn sm" id="again" style="margin-top:6px">Yeniden başla</button></div></div>`; $('#again',el).onclick=()=>VIEWS.dict(el,ep); markDone('dict'); return; }
    const w = words[i]; const ok = res && res.k!=='no';
    el.innerHTML = `<div class="dict">
      <div class="toolbar" style="justify-content:center"><span class="pill">Kelime ${i+1} / ${words.length}</span>${hintOn||res?`<span class="pill plain">İpucu: ${esc(hint(w))}</span>`:'<button class="btn sm ghost" id="hint">İpucu göster</button>'}</div>
      <div class="toolbar" style="justify-content:center">
        <button class="btn primary" data-say="${esc(w)}" data-rate="0.7">${ICON_SPK} Dinle</button>
        <button class="btn" data-say="${esc(w)}" data-rate="0.45">Çok yavaş</button>
      </div>
      <input class="out" id="dIn" dir="rtl" lang="ar" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Duyduğunu yaz" value="${esc(typed)}" ${res?'readonly':''} aria-label="Cevabın (Arapça)">
      <p class="muted" style="margin:0;font-size:.85rem">Hareke yazmak zorunlu değil. İstersen ekleyebilirsin; doğruysa bonus geri bildirim alırsın.</p>
      ${res?`<div class="fb ${ok?'ok':'no'}" style="justify-content:center;font-size:1rem;flex-direction:column;gap:2px"><span>${esc(res.msg)}</span><span class="ar" style="font-size:1.7rem">${esc(w)}</span></div>`:''}
      <div class="kb">${KEYS.map(k=>`<button data-k="${k}" ${res?'disabled':''}>${k}</button>`).join('')}
        <button class="wide" data-k=" " ${res?'disabled':''}>Boşluk</button><button class="wide" data-k="⌫" ${res?'disabled':''}>Sil ⌫</button></div>
      <button class="btn sm ghost" id="mk" aria-expanded="${showMarks}">${showMarks?'Harekeleri gizle':'Hareke ekle (isteğe bağlı)'}</button>
      ${showMarks?`<div class="kb marks">${MARKS.map(([m,l])=>`<button data-k="${m}" title="${l}" aria-label="${l}" ${res?'disabled':''}><span class="mk">ـ${m}</span><small>${l}</small></button>`).join('')}</div>`:''}
      <div class="toolbar" style="justify-content:center">${res?'<button class="btn primary" id="nx">Sonraki kelime →</button>':'<button class="btn primary" id="ck">Kontrol et</button>'}</div>
    </div>`;
    const inp=$('#dIn',el);
    inp.oninput=()=>{ typed=inp.value; };
    inp.onkeydown=ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); (res?$('#nx',el):$('#ck',el))?.click(); } };
    el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; typed = k==='⌫'? [...typed].slice(0,-1).join('') : typed+k; draw(); });
    const ck=$('#ck',el); if(ck) ck.onclick=()=>{ typed=inp.value; const g=gradeDict(typed,w); if(g.k==='empty'){ toast('Önce bir şey yaz.'); return; } res=g; if(g.k!=='no') score++; draw(); };
    const nx=$('#nx',el); if(nx) nx.onclick=()=>{ i++; typed=''; res=null; hintOn=false; draw(); };
    const hb=$('#hint',el); if(hb) hb.onclick=()=>{ hintOn=true; draw(); };
    $('#mk',el).onclick=()=>{ showMarks=!showMarks; draw(); };
  };
  draw();
};

VIEWS.mine = (el, ep) => {
  const st=epState(ep.id); st.mine = st.mine || {}; st.said = st.said||0; const showTr=new Set(); let patOpen=false;
  const draw = () => {
    const sentences = ep.frames.map(f=>{ const v=st.mine[f.key]; return v!=null ? f.tpl.replace('{x}', f.opts[v][0]) : null; }).filter(Boolean);
    const PT = ep.pattern;
    const patHTML = PT ? `<div class="pattern${patOpen?' open':''}">
        <button class="pat-h" id="patT" aria-expanded="${patOpen}"><span class="pill gold">Kalıp</span><span class="ar pat-ar">${esc(PT.ar)}</span><span class="pat-tr">${esc(PT.tr)}</span><span class="chev" aria-hidden="true">${patOpen?'−':'+'}</span></button>
        ${patOpen?`<div class="pat-b"><ul>${PT.notes.map(n=>`<li>${esc(n).replace(/([\u0621-\u064A][\u0621-\u0652\s]*[\u0621-\u0652])/g,'<bdi class="ari">$1</bdi>')}</li>`).join('')}</ul>
          <div class="pat-ex">${PT.examples.map(e=>`<div class="pat-i"><span class="ar">${esc(e.ar)}</span><span class="muted">${esc(e.tr)}</span>${spkBtn(e.ar,'Dinle')}</div>`).join('')}</div></div>`:''}
      </div>` : '';
    el.innerHTML = patHTML + `<div class="frames">${ep.frames.map(f=>{const T=showTr.has(f.key); return `<div class="q frame">
        <div class="qrow"><div class="qt ar">${esc(f.labelAr)}</div>${spkBtn(f.labelAr,'Soruyu dinle')}</div>
        <div><button class="btn sm ghost" data-trf="${f.key}">${T?'Türkçesini gizle':'Türkçesini göster'}</button>${T?` <span class="muted" style="font-size:.9rem">${esc(f.label)}</span>`:''}</div>
        <div class="opts" style="direction:rtl">${f.opts.map(([a,t],j)=>`<button class="opt ar-opt${st.mine[f.key]===j?' right':''}" data-f="${f.key}" data-j="${j}">${esc(f.tpl.replace('{x}',a))}${T?`<span style="display:block;direction:ltr;font-family:var(--f-body);font-size:.8rem;color:var(--muted);line-height:1.4">${esc(t)}</span>`:''}</button>`).join('')}</div></div>`;}).join('')}</div>
      <div class="mine">
        <div class="eyebrow">${esc((ep.ui&&ep.ui.mine&&ep.ui.mine.label)||'Benim sabahım · صَبَاحِي')}</div>
        ${sentences.length?`<div class="ar">${sentences.map(esc).join(' ')}</div>
          <div class="toolbar">${spkBtn(sentences.join(' '),'Paragrafımı dinle')}<span style="font-size:.9rem">Dinle, sonra yüksek sesle oku.</span>
          <button class="btn sm primary" id="said" ${st.said>=3?'disabled':''}>${st.said>=3?'Üç kez okudun ✓':'Sesli okudum ('+st.said+'/3)'}</button></div>`
          :'<div class="muted">Yukarıdan seçim yaptıkça paragrafın burada oluşacak.</div>'}
      </div>
      ${(()=>{const T=(ep.ui&&ep.ui.mine&&ep.ui.mine.task)||{ar:'اِقْرَأْ فِقْرَتَكَ لِزَمِيلِكَ، وَاسْأَلْهُ: مَتَى تَسْتَيْقِظُ؟',tr:'Paragrafını bir arkadaşına oku, sonra ona sor: "Ne zaman uyanıyorsun?"'};return `<div class="note"><div class="ar" style="font-size:1.15rem">${esc(T.ar)}</div>Sınıf görevi: ${esc(T.tr)}</div>`;})()}`;
    el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ st.mine[b.dataset.f]=+b.dataset.j; save(); draw(); });
    const pt=$('#patT',el); if(pt) pt.onclick=()=>{ patOpen=!patOpen; draw(); };
    el.querySelectorAll('[data-trf]').forEach(b=>b.onclick=()=>{ const k=b.dataset.trf; showTr.has(k)?showTr.delete(k):showTr.add(k); draw(); });
    const s=$('#said',el); if(s) s.onclick=()=>{ st.said++; save(); draw(); if(st.said>=3 && Object.keys(st.mine).length===ep.frames.length) markDone('mine'); };
  };
  draw();
};

document.documentElement.lang='tr';
$('#homeBtn').onclick=renderHome;
const SCALES=[0.85,1,1.15,1.3,1.5];
function applyScale(){ const P=prefs(); let i=SCALES.indexOf(P.ars); if(i<0){i=1;P.ars=1;}
  document.documentElement.style.setProperty('--ars', P.ars);
  $('#fsDown').disabled = i===0; $('#fsUp').disabled = i===SCALES.length-1; }
function stepScale(d){ const P=prefs(); let i=SCALES.indexOf(P.ars); if(i<0) i=1; i=Math.max(0,Math.min(SCALES.length-1,i+d)); P.ars=SCALES[i]; save(); applyScale(); toast('Arapça yazı boyutu: %'+Math.round(P.ars*100)); }
$('#fsDown').onclick=()=>stepScale(-1); $('#fsUp').onclick=()=>stepScale(1); applyScale();
const setTop=()=>document.documentElement.style.setProperty('--toph', $('.top').offsetHeight+'px');
setTop(); addEventListener('resize', setTop); if(document.fonts) document.fonts.ready.then(setTop);
const h=(location.hash||'').slice(1);
if(h && EPS.some(e=>e.id===h)) openEp(h); else renderHome();
})();
</script>
